; 早押しボタン ファームウェア
;   親機 (ESP32-DevKitC-32E):       pio run -e master -t upload
;   子機 (XIAO ESP32C6):            pio run -e child -t upload
;   PC 連携の受信機 (XIAO ESP32C6, 使う人だけ):  pio run -e receiver -t upload
;   ロジックのテスト:               pio test -e native
;
; マイコンは日本の技適 (工事設計認証) があるものを使う。番号は docs/bom.md を参照

[platformio]
default_envs = master, child

[esp32_common]
platform = espressif32 @ 8.0.0  ; Arduino-ESP32 3.3.x
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Isrc/common
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.3

[env:master]
extends = esp32_common
board = esp32dev
build_src_filter = +<master/> +<common/>
lib_deps =
    ${esp32_common.lib_deps}
    dfrobot/DFRobotDFPlayerMini @ ^1.0.6

; USB からのログ出力 (USB CDC) と、基板上のアンテナを選ぶ設定は、ボードの定義に入っている
[env:child]
extends = esp32_common
board = seeed_xiao_esp32c6
build_src_filter = +<child/> +<common/>
build_flags =
    ${esp32_common.build_flags}
    -DBOARD_XIAO_ESP32C6

; PC 連携の受信機 (docs/pc-link.md)。親機の無線を聞いて、USB から PC へ状態を流す
[env:receiver]
extends = esp32_common
board = seeed_xiao_esp32c6
build_src_filter = +<receiver/> +<common/radio.cpp>
lib_deps =
build_flags =
    ${esp32_common.build_flags}
    -DBOARD_XIAO_ESP32C6

; PC 上でロジック (arbiter / clock_sync / battery_level / state_tracker / pc_json) をテストする
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
