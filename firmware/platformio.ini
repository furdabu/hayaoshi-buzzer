; 早押しボタン ファームウェア
;   親機:               pio run -e master -t upload
;   子機 (ESP32):       pio run -e child  -t upload
;   子機 (ESP32-C3):    pio run -e child_c3 -t upload
;   ロジックのテスト:   pio test -e native

[platformio]
default_envs = master, child

[esp32_common]
platform = espressif32 @ 8.0.0  ; Arduino-ESP32 3.3.x
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Isrc/common
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.3

[env:master]
extends = esp32_common
board = esp32dev
build_src_filter = +<master/> +<common/>
lib_deps =
    ${esp32_common.lib_deps}
    dfrobot/DFRobotDFPlayerMini @ ^1.0.6

[env:child]
extends = esp32_common
board = esp32dev
build_src_filter = +<child/> +<common/>

; 安価で小さい ESP32-C3 SuperMini を子機に使う場合
[env:child_c3]
extends = esp32_common
board = esp32-c3-devkitm-1
build_src_filter = +<child/> +<common/>
build_flags =
    ${esp32_common.build_flags}
    -DBOARD_C3_SUPERMINI
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; PC 上でロジック (arbiter / clock_sync) をテストする
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
